---
# A GatewayClass and a Gateway with one HTTP listener: enough for the
# controller to create the proxy Deployment, with its default resources.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cnti
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cnti
  namespace: envoy-gateway-system
spec:
  gatewayClassName: cnti
  listeners:
    - name: http
      protocol: HTTP
      port: 80
